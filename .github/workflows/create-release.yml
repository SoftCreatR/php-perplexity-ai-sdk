name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 4.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[Release] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: release
        env:
          VERSION: ${{ inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            first_line="${COMMIT_MESSAGE%%$'\n'*}"
            if [[ ! "$first_line" =~ ^\[Release\][[:space:]]+v?(.+)$ ]]; then
              echo "Release commits must use the subject '[Release] x.y.z'." >&2
              exit 1
            fi

            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch." >&2
            exit 1
          fi

          version="${VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          escaped_version="${version//./\\.}"
          if ! grep -Eq "^## (\\[$escaped_version\\]|$escaped_version)( - [0-9]{4}-[0-9]{2}-[0-9]{2})?$" CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for $version." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release
    needs: prepare
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  create-release:
    name: Create release
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse an existing tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
